# Temporary: find what damages memory before tests/test_chat_thread.py crashes on
# Windows (0xC0000005, ISS-026). Full page heap makes the crash happen at the
# damaging write; cdb prints the native stack there. Branch flake-hunt/* only.
name: Flake hunt
on:
  push:
    branches: ["flake-hunt/**"]
jobs:
  hunt:
    name: page heap + cdb
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Check out the commit under test
        shell: bash
        run: |
          git checkout -q 7c1a891
          git submodule update -q --init --recursive
          git log --oneline -1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt
          pip install -q pytest pytest-timeout
      - name: Find the debugger
        shell: pwsh
        run: |
          $c = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64" -Filter cdb.exe -ErrorAction SilentlyContinue
          if (-not $c) { choco install windows-sdk-10-version-2004-windbg -y --no-progress | Out-Null }
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64" -Filter *.exe | Where-Object { $_.Name -in 'cdb.exe','gflags.exe' } | ForEach-Object { $_.FullName }
      - name: Run under full page heap and cdb (up to 12 times)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          $dbg = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64"
          $py = (Get-Command python).Source
          Write-Host "python: $py"
          & "$dbg\gflags.exe" /p /enable (Split-Path $py -Leaf) /full
          Set-Content cmds.txt "sxe -c `".echo === ACCESS VIOLATION ===; r; kn 60; .echo === END ===; q`" av`ng"
          $found = 0
          for ($i = 1; $i -le 12 -and $found -lt 2; $i++) {
            & "$dbg\cdb.exe" -o -cf cmds.txt -y "srv*C:\symbols*https://msdl.microsoft.com/download/symbols" $py -m pytest -q -p no:cacheprovider -p no:faulthandler tests/test_chat_thread.py *> out.txt
            if (Select-String -Path out.txt -Pattern "=== ACCESS VIOLATION ===" -Quiet) {
              $found++
              Write-Host "run ${i}: ACCESS VIOLATION caught"
              Select-String -Path out.txt -Pattern "=== ACCESS VIOLATION ===" -Context 0,75 | ForEach-Object { $_.Context.PostContext } | Write-Host
            } else {
              Write-Host "run ${i}: no crash"; Get-Content out.txt -Tail 3 | Write-Host
            }
          }
          & "$dbg\gflags.exe" /p /disable (Split-Path $py -Leaf)
