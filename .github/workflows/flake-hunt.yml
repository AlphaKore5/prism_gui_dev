# Temporary: Windows crash rate of test_chat_thread / test_usage_panel before
# and after gui_gc (cycle collector on the GUI thread only). Branch flake-hunt/* only.
name: Flake hunt
on:
  push:
    branches: ["flake-hunt/**"]
jobs:
  hunt:
    name: ${{ matrix.label }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ref: 57a115b, label: "workers on real threads" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Check out the commit under test
        shell: bash
        run: |
          git checkout -q ${{ matrix.ref }}
          git submodule update -q --init --recursive
          git log --oneline -1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt
          pip install -q pytest pytest-timeout
      - name: Catch a crash dump and read it with the debugger
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          choco install procdump -y --no-progress | Out-Null
          $dbg = "C:\Program Files (x86)\Windows Kits\10\Debuggers\x64"
          $py = (Get-Command python).Source
          New-Item -ItemType Directory -Force dumps | Out-Null
          for ($i = 1; $i -le 12; $i++) {
            & procdump -accepteula -ma -e -x dumps $py -X faulthandler -m pytest -q -p no:cacheprovider tests/test_chat_thread.py *> out.txt
            $d = Get-ChildItem dumps -Filter *.dmp -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($d) { Write-Host "run ${i}: dump captured $($d.Name)"; break } else { Write-Host "run ${i}: no crash" }
          }
          $d = Get-ChildItem dumps -Filter *.dmp | Select-Object -First 1
          if (-not $d) { Write-Host "NO DUMP"; exit 0 }
          & "$dbg\cdb.exe" -z $d.FullName -y "srv*C:\symbols*https://msdl.microsoft.com/download/symbols" -c ".ecxr; .echo === STACK ===; kn 50; .echo === ANALYZE ===; !analyze -v; q" *> dbg.txt
          Get-Content dbg.txt | Select-String -Pattern "=== STACK ===" -Context 0,60 | ForEach-Object { $_.Context.PostContext } | Write-Host
          Get-Content dbg.txt | Select-String -Pattern "FAILURE_BUCKET_ID|SYMBOL_NAME|MODULE_NAME|EXCEPTION_CODE_STR|FAULTING_IP|STACK_TEXT" -Context 0,2 | Write-Host
