# Temporary: Windows crash rate of tests/test_chat_thread.py with _Worker.start
# patched once per file (ISS-026). Branch flake-hunt/* only.
name: Flake hunt
on:
  push:
    branches: ["flake-hunt/**"]
jobs:
  hunt:
    name: ${{ matrix.label }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ref: df6b2ca, label: "patched once per file" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Check out the commit under test
        shell: bash
        run: |
          git checkout -q ${{ matrix.ref }}
          git submodule update -q --init --recursive
          git log --oneline -1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt
          pip install -q pytest pytest-timeout
      - name: 30 runs
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          set +e
          bad=0
          for i in $(seq 1 30); do
            python -X faulthandler -m pytest -q -p no:cacheprovider --timeout=120 --timeout-method=thread tests/test_chat_thread.py > out.txt 2>&1
            rc=$?
            if [ $rc -ne 0 ]; then bad=$((bad+1)); echo "run $i: rc=$rc"; grep -B1 -A20 -m1 -E "fatal exception|FAILED" out.txt | grep -v site-packages | head -20; fi
          done
          echo "RESULT ${{ matrix.ref }} test_chat_thread: $bad bad runs in 30"
