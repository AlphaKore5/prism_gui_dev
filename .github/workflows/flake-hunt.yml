# Temporary: Windows crash rate of test_chat_thread / test_usage_panel before
# and after gui_gc (cycle collector on the GUI thread only). Branch flake-hunt/* only.
name: Flake hunt
on:
  push:
    branches: ["flake-hunt/**"]
jobs:
  hunt:
    name: ${{ matrix.label }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ref: f36ac8b, label: "before gui_gc" }
          - { ref: 4c78bd3, label: "with gui_gc" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Check out the commit under test
        shell: bash
        run: |
          git checkout -q ${{ matrix.ref }}
          git submodule update -q --init --recursive
          git log --oneline -1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install -q --upgrade pip
          pip install -q -r requirements.txt
          pip install -q pytest pytest-timeout
      - name: 30 runs of each file
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: |
          set +e
          for f in test_chat_thread test_usage_panel; do
            bad=0
            for i in $(seq 1 30); do
              python -X faulthandler -m pytest -q -p no:cacheprovider --timeout=120 --timeout-method=thread tests/$f.py > out.txt 2>&1
              rc=$?
              if [ $rc -ne 0 ]; then bad=$((bad+1)); echo "$f run $i: rc=$rc"; grep -m1 -E "fatal exception|FAILED|Error" out.txt; fi
            done
            echo "RESULT ${{ matrix.ref }} $f: $bad bad runs in 30"
          done
