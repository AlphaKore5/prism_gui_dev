name: Build desktop apps

# PyInstaller cannot cross-compile, so each OS is built on its own runner.
# Push a tag (v1.0.0) to publish a release; anything else just leaves the
# artifacts attached to the run for testing.
on:
  push:
    branches: [main, master]
    # Not the `v*-assets-<platform>` tags devtools/release_all.py creates
    # for the per-file update assets: a build on those published the
    # archives INTO the assets releases (7 of the 1000 asset slots each,
    # found while shipping 1.4.1) and burned three runners per platform.
    tags: ["v*", "!v*-assets-*"]
  # Pull requests always run the tests (Windows included); they build the
  # installers only when packaging-relevant files change (devtools/ci_changes.py)
  # or the PR has the `build` label. The label is read from the event, so add
  # it before pushing (or push again after adding it).
  pull_request:
  # The installers once a night from main, so a packaging break that no PR
  # touched (a new import PyInstaller misses) still shows within a day.
  schedule:
    - cron: "30 21 * * *"   # 21:30 UTC, 03:00 IST
  # A manual run builds ONE flavour (flavour.py) for testing and nothing else:
  # it never publishes. The release job runs on a pushed tag only, and the
  # update manifest / per-file update assets are made for "complete" only.
  workflow_dispatch:
    inputs:
      flavour:
        description: "Which Prism build to make (artifacts only, nothing is published)"
        type: choice
        options: [complete, studio, sales, engineering]
        default: complete

permissions:
  contents: write   # needed only by the release job

# A newer push to the same branch or PR cancels the run it replaces. A tag run
# gets a group of its own (its run id) and is never cancelled: a release must
# never be stopped half-way by anything. The event and the flavour are in the
# group so the nightly run, a push and manual runs of different flavours on
# the same branch never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ startsWith(github.ref, 'refs/tags/') && github.run_id || github.ref }}-${{ github.event_name }}-${{ inputs.flavour }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Read by packaging/build.py, which bakes it into flavour.py for the build.
  # Push, pull_request and tag runs have no inputs, so they stay "complete".
  PRISM_BUILD_FLAVOUR: ${{ inputs.flavour || 'complete' }}

jobs:
  # ~1,500 tests that had never run in CI once. The workflow built the app on
  # three platforms and smoke-tested that the bundle starts, which says
  # nothing about whether it still WORKS — three lanes change prompt
  # assembly, worker lifetimes and merge-heavy files in the same week, and
  # the first anyone heard about a regression was a rehearsal.
  #
  # Two things had to be fixed before this job could exist at all:
  #   · tests/test_sign_manifest.py read a gitignored dev signing key at
  #     module scope, so on any runner it raised during COLLECTION and took
  #     the whole suite down with it — not a failing test, a suite that
  #     could not start.
  #   · the suite needed a --deselect for a test that hung rather than
  #     failed. That hang was a modal leaking out of an unclosed dialog and
  #     is fixed at source, so `python -m pytest` now runs clean.
  #
  # A red test now stops a release: `release` needs this job. It was
  # continue-on-error until the suite had been green twice on Windows; it has
  # been green on all three platforms on every run since 2026-10-23 (the dev
  # repo's v1.6.10 and v1.6.11 tag runs included). Known, explained failures
  # live in devtools/ci_known_failures.txt and do not fail the job.
  #
  # Sharded: each platform's ~315 test files are split over 4 parallel jobs
  # (devtools/suite_runner.py --shard, balanced by devtools/test_timings.json),
  # so the slowest leg takes about a quarter of the old ~30 minutes. Every
  # shard must pass for `release` (it needs this whole matrix), and the
  # `tests-summary` job below gives each platform one combined verdict.
  # The 4 appears three times: `shard` below, `--shard .../4`, `--shards 4`.
  tests:
    name: Tests · ${{ matrix.label }} ${{ matrix.shard }}/4
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
        shard: [1, 2, 3, 4]
        include:
          - os: ubuntu-22.04
            label: Linux
            pins: linux-x64
          - os: windows-latest
            label: Windows
            pins: windows-x64
          # No macOS: its tests have not run since GitHub refused `macos-14` on
          # 2026-11-17 (that image was retired on 2 November 2026). The app itself
          # is built by `build-macos` below.

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # core.* lives in the engine submodule

      # The key follows the exact pins, so a changed constraints file starts a
      # fresh cache instead of growing the old one. The cache holds downloads
      # only; the install below still runs every time, from the pinned files.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
            constraints/${{ matrix.pins }}.txt

      # PySide6 needs these even under the offscreen platform plugin.
      - name: Install Qt's runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 portaudio19-dev \
            libpulse0
        # libpulse0 is for QtMultimedia, which dlopen()s the platform audio
        # stack — without it the video/audio preview tests skip rather than
        # run. They no longer FAIL without it (the product falls back, and
        # the tests now say so), but a skip that never lifts is a test
        # nobody is running.

      - name: Install PortAudio (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Exact versions (constraints/README.md): a library changes when we
          # change the file, not when PyPI publishes. A missing file fails the job.
          pip install -r requirements.txt -c constraints/${{ matrix.pins }}.txt
          pip install pytest pytest-timeout

      # No PRISM_LICENSE_OFFLINE_DEV here, and never add it. It is read inside
      # licensing._unreachable_answer(), so it changes the ANSWER a revoked
      # licence gets rather than any round trip — it cannot make a hanging
      # test finish, and it makes the revocation test pass for the wrong
      # reason. tests/conftest.py strips it per test; this must not put it back.
      #
      # --timeout because a hung test burns the whole job's budget and reports
      # nothing, which is exactly the failure this suite has form for.
      # One pytest process per test file (devtools/suite_runner.py), not one
      # for all ~4,700 tests: on Windows and macOS a single native crash used
      # to end the run at 30-60% with nothing reported after it. A crash now
      # names its file and is retried once; everything else still reports.
      # Known, explained failures live in devtools/ci_known_failures.txt;
      # anything else fails the job.
      # PRISM_TEST_FLAVOUR runs the suite as the chosen flavour (tests/conftest.py
      # sets flavour.FLAVOUR and skips tests of add-ons that flavour lacks). Empty
      # on push, pull_request and tag runs, which changes nothing.
      - name: Run the test suite
        env:
          PRISM_TEST_FLAVOUR: ${{ inputs.flavour }}
        run: >-
          python devtools/suite_runner.py --timeout 300
          --shard ${{ matrix.shard }}/4
          --summary-json "${{ runner.temp }}/test-summary.json"

      # For tests-summary. Not named prism-*: the release job downloads
      # `prism-*` and publishes all of it.
      - name: Keep this shard's result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-summary-${{ matrix.label }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-summary.json
          if-no-files-found: warn   # tests-summary reports the missing shard
          retention-days: 7

      # Once per platform; it does not depend on which test files a shard ran.
      - name: Scenario checks
        if: matrix.shard == 1
        run: python -m devtools.scenarios

      # Replay only: it re-scores the answers recorded in devtools/evals/cases
      # against their rule checks and compares with devtools/evals/baseline.json.
      # Free, deterministic, opens no socket. Exits 1 on a blocking regression and
      # 2 on a bad case or baseline file, which fails this job and so `release`.
      # It proves the checks still work; it does not ask a model anything. The
      # committed cases are all placeholders (they never block), so today this
      # step can only fail on a broken case or baseline file. The real cases will
      # live in a private place not chosen yet: the runner already reads another
      # folder with `--cases <dir>`, and this job will need a step to fetch them
      # first. No live mode and no secrets here until the owner decides.
      - name: Accuracy gate (replay)
        if: matrix.shard == 1
        run: python devtools/evals/run.py

  # One verdict per platform for the sharded tests above: every shard
  # reported, every test file ran in exactly one shard, and the combined list
  # of NEW FAILURES / crashes / known failures that now pass, in one place.
  # Named like the old single job, so "read Tests · Windows" still works.
  tests-summary:
    name: Tests · ${{ matrix.label }}
    needs: tests
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        label: [Linux, Windows]
    steps:
      - uses: actions/checkout@v4   # tests/ only, to know the full file list
      - uses: actions/download-artifact@v4
        with:
          pattern: test-summary-${{ matrix.label }}-*
          path: summaries
      - name: Combine the shards
        run: python3 devtools/suite_runner.py --merge summaries --shards 4

  # Does this pull request need the installers built? Runs on every event so
  # that `build` (and, through it, `release`) never depends on a SKIPPED job:
  # GitHub skips everything downstream of a skipped job, which on a tag would
  # have skipped the release. Off a pull request its steps are skipped and
  # `build` decides on the event alone.
  changes:
    name: Needs a build?
    runs-on: ubuntu-latest
    outputs:
      packaging: ${{ steps.diff.outputs.packaging }}
    steps:
      # A pull request checks out its merge commit; parent 1 is the base
      # branch, so HEAD^1..HEAD is exactly what the PR changes.
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        if: github.event_name == 'pull_request'
        run: python3 devtools/ci_changes.py HEAD^1 HEAD >> "$GITHUB_OUTPUT"

  # Tags, manual runs, pushes to main and the nightly run always build. A pull
  # request builds when it touches packaging (see `changes`), has the `build`
  # label, or when `changes` could not tell (its output is then empty, which
  # is not 'false'): a wrong "no build" is the one answer never assumed.
  build:
    name: ${{ matrix.label }}
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request'
        || contains(github.event.pull_request.labels.*.name, 'build')
        || needs.changes.outputs.packaging != 'false'
      )
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # a broken macOS build shouldn't hide a good Windows one
      matrix:
        include:
          - os: ubuntu-22.04     # oldest supported glibc — newer ones can't run
            label: Linux (x64)   # binaries built against a newer libc
            pins: linux-x64
          - os: windows-latest
            label: Windows (x64)
            pins: windows-x64
          # macOS is not a leg: `release` needs all of them, and a Mac must not
          # hold up Windows. See `build-macos` at the end of this file; the macOS
          # steps below are kept for the day it is a leg again.
          #
          # No Intel Mac target. macos-15-intel built fine but failed its smoke
          # test, and `release` needs the whole matrix — one red leg blocks the
          # publish for every platform. Dropped rather than debugged, because
          # the machines this is going to are Apple Silicon.
          #
          # An arm64 .dmg will NOT run on an Intel Mac: there is no Rosetta path
          # for it, the app simply won't open. If one ever needs supporting, add
          # `- os: macos-15-intel` back here (GitHub offers that image until
          # Aug 2027) and fix the smoke-test failure it surfaces.

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # prism_terminal is a submodule; without this
                                  # the engine is an empty directory

      # git's message for this ("not our ref <sha>") cost a debugging session
      # once already — if checkout dies, say what it almost certainly means.
      - name: Explain checkout failures
        if: failure()
        run: |
          echo "::error::Checkout failed. Most likely cause: prism_gui pins the \
          prism_terminal submodule to a commit that was never pushed. Run \
          'cd prism_terminal && git push origin HEAD:main' locally, then re-run."

      - uses: actions/setup-python@v5
        with:
          # 3.12, deliberately: 3.13 removed the stdlib audioop that the wake
          # word uses, and PySide6 wheels lag the newest release.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |   # same key as the tests job (see there)
            requirements.txt
            packaging/requirements-build.txt
            constraints/${{ matrix.pins }}.txt

      - name: Install Qt's runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 \
            portaudio19-dev libfuse2 xvfb libpulse0
        # libpulse0: the bundle now ships QtMultimedia (video and audio play
        # inside Prism), and the smoke test's selftest requires it to load.
        # Every Linux desktop with sound has libpulse; a bare runner does not.

      - name: Install PortAudio (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints/${{ matrix.pins }}.txt
          pip install -r packaging/requirements-build.txt -c constraints/${{ matrix.pins }}.txt

      # Prism Studio's browser. `pip install playwright` (above) only gets the
      # Python driver; the Chromium binary is a separate download this step
      # does. PLAYWRIGHT_BROWSERS_PATH=0 is the part that matters: it puts
      # Chromium INSIDE the playwright package (playwright/driver/package/
      # .local-browsers/…) instead of the OS cache dir, which is the only
      # place packaging/prism.spec's collect_data_files(playwright) — and so
      # PyInstaller — can see it. Unset, this step still downloads Chromium,
      # but to a path the frozen build never ships.
      #
      # `--no-shell` skips chrome-headless-shell, the separate binary a bare
      # `launch(headless=True)` resolves to since Playwright 1.49.
      # packaging/prism.spec strips it from the bundle anyway, so downloading
      # it only lengthened the build — and core/browser.py now launches with
      # channel="chromium", which is what makes the full build the one that
      # runs. Those three have to agree; if this flag is ever removed, check
      # the other two first.
      #
      # `--with-deps` on Linux, and it is load-bearing: the runner installs
      # Qt's libraries above but never Chromium's, which are a different set
      # (libnss3, libgbm1, libasound2, libcups2 …). Without them the browser
      # launches and dies immediately, and the smoke test — which now starts
      # a real browser rather than checking a file exists — failed with
      # "Target page, context or browser has been closed" on Linux while
      # Windows and macOS passed, because those two have the equivalents
      # built in.
      #
      # Not on Windows/macOS: install-deps is a Linux apt/dnf routine, and
      # the flag needs a sudo the other two runners do not want.
      - name: Install Chromium for Prism Studio
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: >-
          playwright install --no-shell
          ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      # PyAudio needs PortAudio headers and has no wheel on some platforms;
      # the app runs without it (voice input just reports itself unavailable),
      # so a failure here must not fail the build.
      - name: Install PyAudio (optional)
        continue-on-error: true
        run: pip install pyaudio

      - name: Fetch appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo curl -sSLo /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      # Developer ID signing + notarisation, the moment the secrets exist.
      # Every one of these is OPTIONAL: an unset secret is an empty string,
      # packaging/codesign.py sees no MACOS_SIGN_IDENTITY and prints "not
      # signing" — the build still ships, unsigned, exactly as before. So
      # there is nothing to flip here when the Apple Developer account
      # arrives: add the five secrets and the next tag signs.
      #
      #   MACOS_CERT_P12_BASE64   `base64 -i DeveloperID.p12` of the exported
      #                           "Developer ID Application" certificate
      #   MACOS_CERT_PASSWORD     the password that export was given
      #   MACOS_SIGN_IDENTITY     "Developer ID Application: <Name> (<TEAMID>)"
      #   MACOS_NOTARY_APPLE_ID   the Apple ID that owns the team
      #   MACOS_NOTARY_PASSWORD   an app-specific password for it
      #                           (appleid.apple.com → Sign-In and Security)
      #   MACOS_NOTARY_TEAM_ID    the 10-character team id
      #
      # The certificate goes into a throwaway keychain that dies with the
      # runner; it is never written under the checkout.
      # `secrets` cannot be read in a step's `if` (actionlint: "context
      # secrets is not allowed here"), so the step always runs on macOS and
      # returns early itself when the certificate is absent.
      - name: Import the macOS signing certificate (if configured)
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -e
          if [ -z "$P12" ]; then
            echo "No MACOS_CERT_P12_BASE64 secret - building unsigned (see BUILD.md)."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # The Windows installer (packaging/windows/prism.iss) is compiled by
      # build.py with this exact Inno Setup. The runner image ships 6.7.1
      # (Windows2025 readme, image 20261116); a newer or older image gets
      # 6.7.1 from Chocolatey instead, so the image cannot change the compiler.
      - name: Pin Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $want = '6.7.1'
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          # ISCC.exe's version resource reads 0.0.0 on the runner image (both
          # the numeric and the string field), so trust the version Chocolatey
          # installed, and only when ISCC.exe is really there.
          function Get-Have {
            if (-not (Test-Path $iscc)) { return 'none' }
            $c = (choco list innosetup --exact --limit-output) -split '\|'
            if ($c.Count -ge 2) { return $c[1].Trim() }
            return 'unknown'
          }
          $have = Get-Have
          if ($have -ne $want) {
            Write-Host "Inno Setup on the image: $have; installing $want"
            choco upgrade innosetup --version=$want --allow-downgrade -y --no-progress
            $have = Get-Have
          }
          if ($have -ne $want) { Write-Error "Inno Setup is $have, not $want"; exit 1 }
          Write-Host "Inno Setup $have at $iscc"
          "PRISM_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build
        env:
          # Which licence server this build talks to. A frozen app ignores
          # PRISM_LICENSE_SERVER at runtime (that override would be a bypass),
          # so the URL is compiled in here.
          #
          # Set the repository variable PRISM_SERVER_URL to aim a build at
          # staging or a team-test server. Leave it unset for real releases and
          # the DEFAULT_SERVER in licensing/client.py ships. A repo *variable*,
          # not a secret — it is a public URL, and secrets are masked in logs
          # which makes a wrong one impossible to diagnose.
          PRISM_SERVER_URL: ${{ vars.PRISM_SERVER_URL }}
          # The release channel is a repository variable too, set to `dev`
          # ONLY on the dev repository (AlphaKore5/prism_gui_dev). Unset or
          # empty means prod. packaging/build.py refuses a dev channel inside a
          # production repository and a prod channel inside the dev one.
          PRISM_CHANNEL: ${{ vars.PRISM_CHANNEL }}
          PRISM_UPDATE_REPO: ${{ vars.PRISM_UPDATE_REPO }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Read by packaging/codesign.py; all empty until the secrets exist.
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: python packaging/build.py --clean

      # Proves the bundle actually starts: imports resolve, Qt loads, the
      # window builds. A build that merely *completes* still fails at launch
      # if a hidden import was missed, and that is the failure users see.
      - name: Smoke-test the bundle
        run: python packaging/smoke_test.py

      # Installs the setup.exe for this runner's user, runs the self-test from
      # the INSTALLED folder, swaps it the way an in-app update does,
      # uninstalls, and checks the program is gone and the data folder is not.
      # Writes the setup.exe and .zip sizes to the job summary.
      - name: Install, self-test and uninstall the Windows installer
        if: runner.os == 'Windows'
        run: python packaging/windows/installer_check.py

      # Unsigned, on purpose — see devtools/sign_manifest.py's docstring.
      # CI produces the (public, harmless) file list + hashes; the ACTUAL
      # trust decision (signing it) only ever happens on a human's offline
      # machine, never here. update-research-inapp-download.md §5.2
      # requirement #2 is what this step must never violate: nothing that
      # touches this workflow's secrets can also produce a valid update
      # signature.
      #
      # `platform_tag` mirrors updater.py's own platform_tag() (same
      # os-arch string it uses to build the URLs it fetches) so the human
      # signing this knows which of the three unsigned manifests in the
      # release corresponds to which client platform.
      # Only for the complete build: a flavour build from a manual run is for
      # testing and never feeds the update channel.
      - name: Generate the (unsigned) update manifest
        if: env.PRISM_BUILD_FLAVOUR == 'complete'
        shell: bash
        run: |
          set -e
          PLATFORM_TAG=$(python -c "import sys; sys.path.insert(0, '.'); import updater; print(updater.platform_tag())")
          VERSION=$(python -c "import sys; sys.path.insert(0, '.'); import app_meta; print(app_meta.VERSION)")
          # `|| true` matters: GNU/BSD `ls` exits nonzero when some (not all)
          # of several glob patterns match — exactly the normal case here,
          # since only one of .tar.gz/.zip/.dmg exists per platform. Without
          # it, `set -e` + bash's default `pipefail` abort the whole script
          # right here, silently (no traceback — this failed in CI on every
          # push tonight before this fix, always at this exact line).
          ARCHIVE=$(ls dist/*.tar.gz dist/*.zip dist/*.dmg 2>/dev/null | head -1 || true)
          # The tree that gets INSTALLED, which is what updater.install_dir()
          # swaps and what the manifest's `path`s must be relative to. On
          # macOS that is the bundle (Prism.app/Contents/MacOS/Prism …), not
          # the PyInstaller COLLECT folder it was assembled from — hashing
          # dist/Prism there produced a manifest no installed Mac could ever
          # match a single file of (ISSUES_AND_FIXES.md 5.2).
          UPDATE_ROOT=dist/Prism
          if [ -d dist/Prism.app ]; then UPDATE_ROOT=dist/Prism.app; fi
          python packaging/manifest.py "$UPDATE_ROOT" "$VERSION" \
            -o "dist/manifest.${PLATFORM_TAG}.unsigned.json" \
            --archive "$ARCHIVE"
          echo "PLATFORM_TAG=${PLATFORM_TAG}" >> "$GITHUB_ENV"
          echo "UPDATE_ROOT=${UPDATE_ROOT}" >> "$GITHUB_ENV"

      # Flattened per-file copies, named exactly how updater.py's
      # _file_url() expects to fetch them (<platform>__<path with / as __>)
      # — this is what makes the file-level diff (update-research.md §1/§3)
      # possible: a code-only release only needs the handful of files that
      # actually changed uploaded/downloaded, not the whole archive again.
      - name: Flatten update assets for hosting
        if: env.PRISM_BUILD_FLAVOUR == 'complete'
        shell: bash
        run: |
          set -e
          python packaging/flatten_update_assets.py "$UPDATE_ROOT" dist/update-assets "$PLATFORM_TAG"

      # "complete" keeps the name it always had (prism-<os>); a flavour adds
      # itself (prism-sales-<os>). The release job only ever runs on a tag, and
      # a tag run is always "complete".
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PRISM_BUILD_FLAVOUR == 'complete' && format('prism-{0}', matrix.os) || format('prism-{0}-{1}', env.PRISM_BUILD_FLAVOUR, matrix.os) }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*-setup.exe
            dist/*.dmg
            dist/*.AppImage
            dist/manifest.*.unsigned.json
          if-no-files-found: error
          retention-days: 14
          # The archives are compressed already; zipping them again only cost
          # time. The level changes the artifact's transport zip, not the files
          # in it, so what `release` publishes is identical.
          compression-level: 0

      # Deliberately NAMED WITHOUT THE "prism-" PREFIX, and deliberately a
      # separate artifact from the one above: the `release` job below only
      # downloads artifacts matching `prism-*`, so these thousands of small
      # per-file assets are never swept into `artifacts/**/*` and published
      # automatically. They stay a plain 14-day workflow artifact until a
      # human runs the signing step and publishes them by hand — see
      # RELEASING-UPDATES.md. (Getting this naming wrong would mean every
      # tagged push silently attaches ~1300+ unsigned files per platform to
      # a public release — check this if you ever touch the naming here.)
      - if: env.PRISM_BUILD_FLAVOUR == 'complete'
        uses: actions/upload-artifact@v4
        with:
          name: update-assets-${{ matrix.os }}
          path: dist/update-assets/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [build, tests]
    # A pushed tag only. `github.event_name == 'push'` matters: a manual run
    # started with `--ref v1.2.3` has a tag ref too, and must not publish.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # `pattern: prism-*` deliberately excludes the `update-assets-*`
      # artifacts (see their upload step's comment) — this release gets the
      # archives + unsigned manifests only. Nothing update-related that a
      # client could fetch and run is published here automatically; that is
      # a separate, human-run step. See RELEASING-UPDATES.md.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: prism-*
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            **New here?** [GETTING_STARTED.md](https://github.com/${{ github.repository }}/blob/main/GETTING_STARTED.md)
            has the full walkthrough — which file to pick, first launch, first run.

            Quick version: builds are unsigned, so the OS warns on first launch.
            **macOS** (Apple Silicon only): right-click Prism.app → Open → Open.
            On macOS 15+ that dialog has no Open button — close it, then
            System Settings → Privacy & Security → **Open Anyway**. If macOS
            says the app "is damaged", clear the quarantine flag:
            `xattr -dr com.apple.quarantine /Applications/Prism.app`
            **Windows**: run the `-setup.exe` (installs for you only, no admin
            rights) or unzip the `.zip`; SmartScreen → More info → Run anyway.
            **Linux**: `chmod +x` the AppImage, or extract the tarball and run
            `./install.sh`.

            Prism drives **Google Chrome**, which must be installed separately.

            ---
            _In-app update assets (`manifest.*.unsigned.json` above, plus the
            `update-assets-*` workflow artifacts on this run) are unsigned and
            not yet usable by the app's updater. See RELEASING-UPDATES.md for
            the one remaining manual step (sign + publish) before this
            release is fetchable by Prism's in-app updater._

  # macOS, Apple Silicon, on GitHub's own runner. `macos-15` is a STANDARD runner
  # (free while this repository is public); never use a `-large` or `-xlarge`
  # label, those are billed. The old `macos-14` was retired on 2 November 2026.
  #
  # A job of its own and not a leg of `build`, because `release` needs the whole
  # of `build`: a Mac that fails, or that GitHub does not hand out, must not hold
  # up Windows. Nothing needs this job.
  #
  # Its result is a workflow artifact only, UNSIGNED and for testers. The name
  # must not start with `prism-`: `release` publishes every `prism-*` artifact it
  # finds, so the Mac would get into a release or not depending on which job
  # finished first. No update manifest or update files are made for it yet.
  build-macos:
    name: macOS (Apple Silicon, testers)
    needs: changes
    if: >-
      !cancelled() && (
        github.event_name != 'pull_request'
        || contains(github.event.pull_request.labels.*.name, 'build')
        || needs.changes.outputs.packaging != 'false'
      )
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: macos-15
            pins: macos-arm64
    env:
      # The oldest macOS the app runs on (owner, 2026-11-25: 14, Sonoma). The same
      # number is in packaging/prism.spec and macos-pins.yml.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # why 3.12: see `build`
          cache: pip
          cache-dependency-path: |
            requirements.txt
            packaging/requirements-build.txt
            constraints/${{ matrix.pins }}.txt

      # The pin file is recorded by the workflow "Record macOS pin file". Until it
      # is committed, a test build takes the newest versions and says so (an empty
      # constraints file pins nothing). A tag never does.
      - name: The macOS pin file
        run: |
          PINS="constraints/${{ matrix.pins }}.txt"
          if [ -f "$PINS" ]; then exit 0; fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "::error::$PINS is missing. Run 'Record macOS pin file' and commit its result (constraints/README.md)."
            exit 1
          fi
          echo "::warning::NOT PINNED: $PINS is missing, so this Mac test build takes the newest version of every library. Run 'Record macOS pin file' and commit its result."
          : > "$PINS"

      - name: PortAudio for macOS 14
        run: bash packaging/macos_portaudio.sh

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints/${{ matrix.pins }}.txt
          pip install -r packaging/requirements-build.txt -c constraints/${{ matrix.pins }}.txt

      # Why PLAYWRIGHT_BROWSERS_PATH=0 and --no-shell: see the same step in `build`.
      - name: Install Chromium for Prism Studio
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: playwright install --no-shell chromium

      - name: Build
        id: build
        env:   # what each one is: the same step in `build`. No signing secrets.
          PRISM_SERVER_URL: ${{ vars.PRISM_SERVER_URL }}
          PRISM_CHANNEL: ${{ vars.PRISM_CHANNEL }}
          PRISM_UPDATE_REPO: ${{ vars.PRISM_UPDATE_REPO }}
        run: python packaging/build.py --clean

      - name: Smoke-test the bundle
        run: python packaging/smoke_test.py

      - name: Check the oldest macOS the bundle runs on
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}   # both answers in one run
        run: python packaging/check_macos_minos.py dist/Prism.app "$MACOSX_DEPLOYMENT_TARGET"

      - name: Say what this build is
        run: |
          {
            echo "### Mac build ($PRISM_BUILD_FLAVOUR): unsigned, for testers only"
            echo
            echo "- Not signed and not notarised (no Apple Developer account), so macOS warns on first launch: right-click, Open; on macOS 15 and later, System Settings > Privacy & Security > Open Anyway."
            echo "- Needs an Apple Silicon Mac with macOS $MACOSX_DEPLOYMENT_TARGET or later."
            echo "- Opening DWG files is expected to fail below macOS 26: the bundled converter needs it (RELEASE_ISSUES.md, 2026-11-25)."
            echo "- Not published in any release, and in-app updates are not made for it."
            echo "- The test suite does not run on macOS; only the packaged-app self-test does."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-testers-${{ env.PRISM_BUILD_FLAVOUR }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
