name: Build desktop apps

# PyInstaller cannot cross-compile, so each OS is built on its own runner.
# Push a tag (v1.0.0) to publish a release; anything else just leaves the
# artifacts attached to the run for testing.
on:
  push:
    branches: [main, master]
    # Not the `v*-assets-<platform>` tags devtools/release_all.py creates
    # for the per-file update assets: a build on those published the
    # archives INTO the assets releases (7 of the 1000 asset slots each,
    # found while shipping 1.4.1) and burned three runners per platform.
    tags: ["v*", "!v*-assets-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only by the release job

jobs:
  # ~1,500 tests that had never run in CI once. The workflow built the app on
  # three platforms and smoke-tested that the bundle starts, which says
  # nothing about whether it still WORKS — three lanes change prompt
  # assembly, worker lifetimes and merge-heavy files in the same week, and
  # the first anyone heard about a regression was a rehearsal.
  #
  # Two things had to be fixed before this job could exist at all:
  #   · tests/test_sign_manifest.py read a gitignored dev signing key at
  #     module scope, so on any runner it raised during COLLECTION and took
  #     the whole suite down with it — not a failing test, a suite that
  #     could not start.
  #   · the suite needed a --deselect for a test that hung rather than
  #     failed. That hang was a modal leaking out of an unclosed dialog and
  #     is fixed at source, so `python -m pytest` now runs clean.
  #
  # continue-on-error DELIBERATELY, for now: a job that flaps during freeze
  # week trains everyone to ignore it. Flip it to false once the suite has
  # been green twice on Windows — that is the whole point of running it here.
  tests:
    name: Tests · ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: Linux
          - os: windows-latest
            label: Windows
          - os: macos-14
            label: macOS

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # core.* lives in the engine submodule

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # PySide6 needs these even under the offscreen platform plugin.
      - name: Install Qt's runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 portaudio19-dev \
            libpulse0
        # libpulse0 is for QtMultimedia, which dlopen()s the platform audio
        # stack — without it the video/audio preview tests skip rather than
        # run. They no longer FAIL without it (the product falls back, and
        # the tests now say so), but a skip that never lifts is a test
        # nobody is running.

      - name: Install PortAudio (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      # No PRISM_LICENSE_OFFLINE_DEV here, and never add it. It is read inside
      # licensing._unreachable_answer(), so it changes the ANSWER a revoked
      # licence gets rather than any round trip — it cannot make a hanging
      # test finish, and it makes the revocation test pass for the wrong
      # reason. tests/conftest.py strips it per test; this must not put it back.
      #
      # --timeout because a hung test burns the whole job's budget and reports
      # nothing, which is exactly the failure this suite has form for.
      # One pytest process per test file (devtools/suite_runner.py), not one
      # for all ~4,700 tests: on Windows and macOS a single native crash used
      # to end the run at 30-60% with nothing reported after it. A crash now
      # names its file and is retried once; everything else still reports.
      # Known, explained failures live in devtools/ci_known_failures.txt;
      # anything else fails the job.
      - name: Run the test suite
        run: python devtools/suite_runner.py --timeout 300

      - name: Scenario checks
        run: python -m devtools.scenarios

  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # a broken macOS build shouldn't hide a good Windows one
      matrix:
        include:
          - os: ubuntu-22.04     # oldest supported glibc — newer ones can't run
            label: Linux (x64)   # binaries built against a newer libc
          - os: windows-latest
            label: Windows (x64)
          - os: macos-14         # Apple Silicon
            label: macOS (Apple Silicon)
          # No Intel Mac target. macos-15-intel built fine but failed its smoke
          # test, and `release` needs the whole matrix — one red leg blocks the
          # publish for every platform. Dropped rather than debugged, because
          # the machines this is going to are Apple Silicon.
          #
          # An arm64 .dmg will NOT run on an Intel Mac: there is no Rosetta path
          # for it, the app simply won't open. If one ever needs supporting, add
          # `- os: macos-15-intel` back here (GitHub offers that image until
          # Aug 2027) and fix the smoke-test failure it surfaces.

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # prism_terminal is a submodule; without this
                                  # the engine is an empty directory

      # git's message for this ("not our ref <sha>") cost a debugging session
      # once already — if checkout dies, say what it almost certainly means.
      - name: Explain checkout failures
        if: failure()
        run: |
          echo "::error::Checkout failed. Most likely cause: prism_gui pins the \
          prism_terminal submodule to a commit that was never pushed. Run \
          'cd prism_terminal && git push origin HEAD:main' locally, then re-run."

      - uses: actions/setup-python@v5
        with:
          # 3.12, deliberately: 3.13 removed the stdlib audioop that the wake
          # word uses, and PySide6 wheels lag the newest release.
          python-version: "3.12"
          cache: pip

      - name: Install Qt's runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            libxcb-xinerama0 libxcb-xfixes0 libdbus-1-3 \
            portaudio19-dev libfuse2 xvfb

      - name: Install PortAudio (macOS)
        if: runner.os == 'macOS'
        run: brew install portaudio

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r packaging/requirements-build.txt

      # Prism Studio's browser. `pip install playwright` (above) only gets the
      # Python driver; the Chromium binary is a separate download this step
      # does. PLAYWRIGHT_BROWSERS_PATH=0 is the part that matters: it puts
      # Chromium INSIDE the playwright package (playwright/driver/package/
      # .local-browsers/…) instead of the OS cache dir, which is the only
      # place packaging/prism.spec's collect_data_files(playwright) — and so
      # PyInstaller — can see it. Unset, this step still downloads Chromium,
      # but to a path the frozen build never ships.
      #
      # `--no-shell` skips chrome-headless-shell, the separate binary a bare
      # `launch(headless=True)` resolves to since Playwright 1.49.
      # packaging/prism.spec strips it from the bundle anyway, so downloading
      # it only lengthened the build — and core/browser.py now launches with
      # channel="chromium", which is what makes the full build the one that
      # runs. Those three have to agree; if this flag is ever removed, check
      # the other two first.
      #
      # `--with-deps` on Linux, and it is load-bearing: the runner installs
      # Qt's libraries above but never Chromium's, which are a different set
      # (libnss3, libgbm1, libasound2, libcups2 …). Without them the browser
      # launches and dies immediately, and the smoke test — which now starts
      # a real browser rather than checking a file exists — failed with
      # "Target page, context or browser has been closed" on Linux while
      # Windows and macOS passed, because those two have the equivalents
      # built in.
      #
      # Not on Windows/macOS: install-deps is a Linux apt/dnf routine, and
      # the flag needs a sudo the other two runners do not want.
      - name: Install Chromium for Prism Studio
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"
        run: >-
          playwright install --no-shell
          ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      # PyAudio needs PortAudio headers and has no wheel on some platforms;
      # the app runs without it (voice input just reports itself unavailable),
      # so a failure here must not fail the build.
      - name: Install PyAudio (optional)
        continue-on-error: true
        run: pip install pyaudio

      - name: Fetch appimagetool (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo curl -sSLo /usr/local/bin/appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool

      # Developer ID signing + notarisation, the moment the secrets exist.
      # Every one of these is OPTIONAL: an unset secret is an empty string,
      # packaging/codesign.py sees no MACOS_SIGN_IDENTITY and prints "not
      # signing" — the build still ships, unsigned, exactly as before. So
      # there is nothing to flip here when the Apple Developer account
      # arrives: add the five secrets and the next tag signs.
      #
      #   MACOS_CERT_P12_BASE64   `base64 -i DeveloperID.p12` of the exported
      #                           "Developer ID Application" certificate
      #   MACOS_CERT_PASSWORD     the password that export was given
      #   MACOS_SIGN_IDENTITY     "Developer ID Application: <Name> (<TEAMID>)"
      #   MACOS_NOTARY_APPLE_ID   the Apple ID that owns the team
      #   MACOS_NOTARY_PASSWORD   an app-specific password for it
      #                           (appleid.apple.com → Sign-In and Security)
      #   MACOS_NOTARY_TEAM_ID    the 10-character team id
      #
      # The certificate goes into a throwaway keychain that dies with the
      # runner; it is never written under the checkout.
      # `secrets` cannot be read in a step's `if` (actionlint: "context
      # secrets is not allowed here"), so the step always runs on macOS and
      # returns early itself when the certificate is absent.
      - name: Import the macOS signing certificate (if configured)
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          set -e
          if [ -z "$P12" ]; then
            echo "No MACOS_CERT_P12_BASE64 secret - building unsigned (see BUILD.md)."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build
        env:
          # Which licence server this build talks to. A frozen app ignores
          # PRISM_LICENSE_SERVER at runtime (that override would be a bypass),
          # so the URL is compiled in here.
          #
          # Set the repository variable PRISM_SERVER_URL to aim a build at
          # staging or a team-test server. Leave it unset for real releases and
          # the DEFAULT_SERVER in licensing/client.py ships. A repo *variable*,
          # not a secret — it is a public URL, and secrets are masked in logs
          # which makes a wrong one impossible to diagnose.
          PRISM_SERVER_URL: ${{ vars.PRISM_SERVER_URL }}
          # The release channel is a repository variable too, set to `dev`
          # ONLY on the dev repository (AlphaKore5/prism_gui_dev). Unset or
          # empty means prod. packaging/build.py refuses a dev channel inside a
          # production repository and a prod channel inside the dev one.
          PRISM_CHANNEL: ${{ vars.PRISM_CHANNEL }}
          PRISM_UPDATE_REPO: ${{ vars.PRISM_UPDATE_REPO }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Read by packaging/codesign.py; all empty until the secrets exist.
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          MACOS_NOTARY_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          MACOS_NOTARY_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: python packaging/build.py --clean

      # Proves the bundle actually starts: imports resolve, Qt loads, the
      # window builds. A build that merely *completes* still fails at launch
      # if a hidden import was missed, and that is the failure users see.
      - name: Smoke-test the bundle
        run: python packaging/smoke_test.py

      # Unsigned, on purpose — see devtools/sign_manifest.py's docstring.
      # CI produces the (public, harmless) file list + hashes; the ACTUAL
      # trust decision (signing it) only ever happens on a human's offline
      # machine, never here. update-research-inapp-download.md §5.2
      # requirement #2 is what this step must never violate: nothing that
      # touches this workflow's secrets can also produce a valid update
      # signature.
      #
      # `platform_tag` mirrors updater.py's own platform_tag() (same
      # os-arch string it uses to build the URLs it fetches) so the human
      # signing this knows which of the three unsigned manifests in the
      # release corresponds to which client platform.
      - name: Generate the (unsigned) update manifest
        shell: bash
        run: |
          set -e
          PLATFORM_TAG=$(python -c "import sys; sys.path.insert(0, '.'); import updater; print(updater.platform_tag())")
          VERSION=$(python -c "import sys; sys.path.insert(0, '.'); import app_meta; print(app_meta.VERSION)")
          # `|| true` matters: GNU/BSD `ls` exits nonzero when some (not all)
          # of several glob patterns match — exactly the normal case here,
          # since only one of .tar.gz/.zip/.dmg exists per platform. Without
          # it, `set -e` + bash's default `pipefail` abort the whole script
          # right here, silently (no traceback — this failed in CI on every
          # push tonight before this fix, always at this exact line).
          ARCHIVE=$(ls dist/*.tar.gz dist/*.zip dist/*.dmg 2>/dev/null | head -1 || true)
          # The tree that gets INSTALLED, which is what updater.install_dir()
          # swaps and what the manifest's `path`s must be relative to. On
          # macOS that is the bundle (Prism.app/Contents/MacOS/Prism …), not
          # the PyInstaller COLLECT folder it was assembled from — hashing
          # dist/Prism there produced a manifest no installed Mac could ever
          # match a single file of (ISSUES_AND_FIXES.md 5.2).
          UPDATE_ROOT=dist/Prism
          if [ -d dist/Prism.app ]; then UPDATE_ROOT=dist/Prism.app; fi
          python packaging/manifest.py "$UPDATE_ROOT" "$VERSION" \
            -o "dist/manifest.${PLATFORM_TAG}.unsigned.json" \
            --archive "$ARCHIVE"
          echo "PLATFORM_TAG=${PLATFORM_TAG}" >> "$GITHUB_ENV"
          echo "UPDATE_ROOT=${UPDATE_ROOT}" >> "$GITHUB_ENV"

      # Flattened per-file copies, named exactly how updater.py's
      # _file_url() expects to fetch them (<platform>__<path with / as __>)
      # — this is what makes the file-level diff (update-research.md §1/§3)
      # possible: a code-only release only needs the handful of files that
      # actually changed uploaded/downloaded, not the whole archive again.
      - name: Flatten update assets for hosting
        shell: bash
        run: |
          set -e
          python packaging/flatten_update_assets.py "$UPDATE_ROOT" dist/update-assets "$PLATFORM_TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: prism-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/manifest.*.unsigned.json
          if-no-files-found: error
          retention-days: 14

      # Deliberately NAMED WITHOUT THE "prism-" PREFIX, and deliberately a
      # separate artifact from the one above: the `release` job below only
      # downloads artifacts matching `prism-*`, so these thousands of small
      # per-file assets are never swept into `artifacts/**/*` and published
      # automatically. They stay a plain 14-day workflow artifact until a
      # human runs the signing step and publishes them by hand — see
      # RELEASING-UPDATES.md. (Getting this naming wrong would mean every
      # tagged push silently attaches ~1300+ unsigned files per platform to
      # a public release — check this if you ever touch the naming here.)
      - uses: actions/upload-artifact@v4
        with:
          name: update-assets-${{ matrix.os }}
          path: dist/update-assets/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # `pattern: prism-*` deliberately excludes the `update-assets-*`
      # artifacts (see their upload step's comment) — this release gets the
      # archives + unsigned manifests only. Nothing update-related that a
      # client could fetch and run is published here automatically; that is
      # a separate, human-run step. See RELEASING-UPDATES.md.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: prism-*
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            **New here?** [GETTING_STARTED.md](https://github.com/${{ github.repository }}/blob/main/GETTING_STARTED.md)
            has the full walkthrough — which file to pick, first launch, first run.

            Quick version: builds are unsigned, so the OS warns on first launch.
            **macOS** (Apple Silicon only): right-click Prism.app → Open → Open.
            On macOS 15+ that dialog has no Open button — close it, then
            System Settings → Privacy & Security → **Open Anyway**. If macOS
            says the app "is damaged", clear the quarantine flag:
            `xattr -dr com.apple.quarantine /Applications/Prism.app`
            **Windows**: SmartScreen → More info → Run anyway.
            **Linux**: `chmod +x` the AppImage, or extract the tarball and run
            `./install.sh`.

            Prism drives **Google Chrome**, which must be installed separately.

            ---
            _In-app update assets (`manifest.*.unsigned.json` above, plus the
            `update-assets-*` workflow artifacts on this run) are unsigned and
            not yet usable by the app's updater. See RELEASING-UPDATES.md for
            the one remaining manual step (sign + publish) before this
            release is fetchable by Prism's in-app updater._
